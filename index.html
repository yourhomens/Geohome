CTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Home - უძრავი ქონება</title>
    <style>
        :root {
            --olive-dark: #3b5323;
            --border: #ddd;
            --muted: #666;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .search-box {
            background: #fff;
            padding: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .listing-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .listing-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .listing-content {
            padding: 15px;
        }
        .price {
            font-size: 18px;
            color: var(--olive-dark);
            margin-bottom: 8px;
        }
        .location {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 8px;
        }
        .details {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="search-box">
        <h2>იპოვე შენი სახლი მარტივად</h2>
    </div>

    <main>
        <h1>უძრავი ქონების ბოლო განცხადებები</h1>
        <div id="listings-container" class="listings-grid">
            <p>განცხადებები მალე დაემატება.</p>
        </div>
    </main>

</body>
</html>
