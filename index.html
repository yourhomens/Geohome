<script>

const SUPABASE_URL =
"https://clymnqkiarrpatcfuwwt.supabase.co";

const SUPABASE_KEY =
"sb_publishable__CQ1qg7_KizhMzPKDaD3tA_TQq6AzsM";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* MESSAGE */

function showMessage(text){

    const message =
        document.getElementById("message");

    if(!message){
        alert(text);
        return;
    }

    message.textContent = text;
    message.classList.add("show");

    setTimeout(function(){
        message.classList.remove("show");
    },3000);
}


/* USER */

let currentUser = null;


async function loadCurrentUser(){

    const result =
        await supabaseClient.auth.getUser();

    if(result.error){
        currentUser = null;
    }else{
        currentUser = result.data.user || null;
    }

    updateLoginButton();
}


function updateLoginButton(){

    const button =
        document.getElementById("loginButton");

    if(!button) return;

    if(currentUser){

        button.textContent =
            currentUser.user_metadata?.name ||
            currentUser.email;

    }else{

        button.textContent = "შესვლა";

    }

}


/* AUTH STATE */

supabaseClient.auth.onAuthStateChange(
    function(event, session){

        currentUser =
            session?.user || null;

        updateLoginButton();

    }
);


/* LOGIN MODAL */

const loginModal =
    document.getElementById("loginModal");


document
.getElementById("loginButton")
.addEventListener(
    "click",
    async function(){

        if(currentUser){

            const logout =
                confirm(
                    "გსურთ ანგარიშიდან გამოსვლა?"
                );

            if(logout){

                await supabaseClient.auth.signOut();

                currentUser = null;

                updateLoginButton();

                showMessage(
                    "ანგარიშიდან გამოხვედით."
                );

            }

        }else{

            loginModal.classList.add("active");

        }

    }
);


document
.getElementById("loginClose")
.addEventListener(
    "click",
    function(){

        loginModal.classList.remove("active");

    }
);


/* LOGIN TABS */

document
.querySelectorAll(".login-tab")
.forEach(function(tab){

    tab.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".login-tab")
            .forEach(function(item){

                item.classList.remove("active");

            });

            document
            .querySelectorAll(".login-form")
            .forEach(function(form){

                form.classList.remove("active");

            });

            this.classList.add("active");

            const type =
                this.dataset.loginTab;

            if(type === "login"){

                document
                .getElementById("loginForm")
                .classList.add("active");

            }else{

                document
                .getElementById("registerForm")
                .classList.add("active");

            }

        }
    );

});


/* REGISTER */

document
.getElementById("fakeRegister")
.addEventListener(
    "click",
    async function(){

        const name =
            document
            .getElementById("registerName")
            .value
            .trim();

        const email =
            document
            .getElementById("registerEmail")
            .value
            .trim()
            .toLowerCase();

        const phone =
            document
            .getElementById("registerPhone")
            .value
            .trim();

        const password =
            document
            .getElementById("registerPassword")
            .value;

        const repeatPassword =
            document
            .getElementById("registerRepeatPassword")
            .value;


        if(!name){

            showMessage(
                "შეიყვანეთ სახელი და გვარი."
            );

            return;
        }


        if(!email){

            showMessage(
                "შეიყვანეთ ელფოსტა."
            );

            return;
        }


        if(!email.includes("@")){

            showMessage(
                "ელფოსტა არასწორია."
            );

            return;
        }


        if(!phone){

            showMessage(
                "შეიყვანეთ ტელეფონის ნომერი."
            );

            return;
        }


        if(password.length < 6){

            showMessage(
                "პაროლი მინიმუმ 6 სიმბოლო უნდა იყოს."
            );

            return;
        }


        if(password !== repeatPassword){

            showMessage(
                "პაროლები ერთმანეთს არ ემთხვევა."
            );

            return;
        }


        const result =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {
                        name: name,
                        phone: phone
                    }

                }

            });


        if(result.error){

            showMessage(
                result.error.message
            );

            return;
        }


        if(result.data.user){

            if(result.data.session){

                currentUser =
                    result.data.user;

                updateLoginButton();

                loginModal.classList.remove(
                    "active"
                );

                showMessage(
                    "რეგისტრაცია წარმატებით დასრულდა ❤️"
                );

            }else{

                showMessage(
                    "რეგისტრაცია დასრულდა ❤️ შეამოწმეთ ელფოსტა და დაადასტურეთ ანგარიში."
                );

            }

        }

    }
);


/* LOGIN */

document
.getElementById("fakeLogin")
.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();

        const password =
            document
            .getElementById("loginPassword")
            .value;


        if(!email || !password){

            showMessage(
                "შეავსეთ ელფოსტა და პაროლი."
            );

            return;
        }


        const result =
            await supabaseClient.auth
            .signInWithPassword({

                email: email,
                password: password

            });


        if(result.error){

            showMessage(
                result.error.message
            );

            return;
        }


        currentUser =
            result.data.user;

        updateLoginButton();

        loginModal.classList.remove(
            "active"
        );

        showMessage(
            "კეთილი იყოს თქვენი დაბრუნება ❤️"
        );

    }
);


/* PASSWORD RESET */

document
.getElementById("forgotPassword")
.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();

        if(!email){

            showMessage(
                "ჯერ შეიყვანეთ ელფოსტა."
            );

            return;
        }


        const result =
            await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin
                }
            );


        if(result.error){

            showMessage(
                result.error.message
            );

            return;
        }


        showMessage(
            "პაროლის აღდგენის ბმული გამოგზავნილია."
        );

    }
);


/* FACEBOOK */

document
.getElementById("fakeFacebook")
.addEventListener(
    "click",
    async function(){

        const result =
            await supabaseClient.auth
            .signInWithOAuth({

                provider: "facebook",

                options: {
                    redirectTo:
                        window.location.origin
                }

            });


        if(result.error){

            showMessage(
                result.error.message
            );

        }

    }
);


/* LOGIN REQUIRED */

function requireLogin(){

    if(!currentUser){

        loginModal.classList.add("active");

        showMessage(
            "გთხოვთ გაიაროთ ავტორიზაცია."
        );

        return false;
    }

    return true;
}


/* START */

loadCurrentUser();

</script>
</body>
</html>
