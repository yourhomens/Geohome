<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeoHome — უძრავი ქონება საქართველოში</title>

<style>
:root{
    --olive:#7d8b45;
    --olive-dark:#59652d;
    --olive-light:#eef1df;
    --dark:#222820;
    --text:#3f453d;
    --muted:#7b8179;
    --bg:#f7f8f5;
    --white:#ffffff;
    --border:#e3e6df;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--dark);
}

button,input,select{
    font-family:inherit;
}

header{
    background:white;
    border-bottom:1px solid var(--border);
    padding:15px 5%;
    display:flex;
    align-items:center;
    gap:30px;
    position:sticky;
    top:0;
    z-index:100;
}

/* ================= LOGO ================= */

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:190px;
}

.logo-mark{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo-mark svg{
    width:43px;
    height:43px;
    fill:none;
    stroke:var(--olive);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.logo-text{
    font-size:24px;
    font-weight:800;
    color:var(--dark);
    letter-spacing:-.5px;
}

.logo-text span{
    color:var(--olive);
}

/* ================= MENU ================= */

nav{
    display:flex;
    gap:20px;
    flex:1;
}

nav a{
    text-decoration:none;
    color:var(--text);
    font-size:14px;
}

nav a:hover{
    color:var(--olive-dark);
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.language{
    border:1px solid var(--border);
    background:white;
    padding:9px;
    border-radius:8px;
}

.login{
    color:var(--dark);
    text-decoration:none;
    font-weight:600;
    padding:10px;
}

.add-btn{
    background:var(--olive);
    color:white;
    text-decoration:none;
    padding:11px 16px;
    border-radius:9px;
    font-weight:700;
}

/* ================= HERO ================= */

.hero{
    min-height:530px;
    background:
    linear-gradient(rgba(30,38,28,.42),rgba(30,38,28,.64)),
    url("https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1800&q=85");
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:70px 5%;
}

.hero-content{
    width:100%;
    max-width:1100px;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero p{
    font-size:19px;
    margin-bottom:35px;
}

/* ================= SEARCH ================= */

.search-box{
    background:white;
    border-radius:18px;
    padding:10px;
    box-shadow:0 15px 45px rgba(0,0,0,.2);
    color:var(--dark);
}

.tabs{
    display:flex;
    gap:5px;
    padding:4px;
    border-bottom:1px solid var(--border);
}

.tabs button{
    border:none;
    background:white;
    padding:13px 22px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
    color:var(--muted);
}

.tabs button.active{
    background:var(--olive-light);
    color:var(--olive-dark);
}

.search-main{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr auto;
    gap:9px;
    padding-top:12px;
}

.field{
    border:1px solid var(--border);
    border-radius:9px;
    padding:11px;
    text-align:left;
    background:white;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:5px;
}

.field select,
.field input{
    border:none;
    outline:none;
    width:100%;
    font-size:14px;
    background:white;
    color:var(--dark);
}

.search-btn{
    border:none;
    background:var(--olive);
    color:white;
    padding:0 22px;
    border-radius:9px;
    font-weight:700;
    cursor:pointer;
}

/* ================= FILTERS ================= */

.filters{
    max-width:1200px;
    margin:35px auto 0;
    padding:0 25px;
}

.filter-row{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.filter-chip{
    border:1px solid var(--border);
    background:white;
    padding:11px 15px;
    border-radius:9px;
    cursor:pointer;
}

.filter-chip:hover{
    border-color:var(--olive);
    color:var(--olive-dark);
}

/* ================= SECTIONS ================= */

.section{
    max-width:1200px;
    margin:55px auto;
    padding:0 25px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.section-head h2{
    font-size:27px;
}

.section-head a{
    color:var(--olive-dark);
    text-decoration:none;
    font-weight:600;
}

/* ================= CARDS ================= */

.properties{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    border:1px solid var(--border);
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,0,0,.09);
}

.card-img{
    height:220px;
    background-size:cover;
    background-position:center;
    position:relative;
}

.badge{
    position:absolute;
    top:12px;
    left:12px;
    background:var(--olive);
    color:white;
    padding:7px 10px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.heart{
    position:absolute;
    right:12px;
    top:12px;
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:white;
    font-size:19px;
    cursor:pointer;
}

.card-body{
    padding:17px;
}

.price{
    font-size:23px;
    font-weight:800;
    margin-bottom:7px;
}

.address{
    color:var(--muted);
    margin-bottom:14px;
}

.details{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    border-top:1px solid var(--border);
    padding-top:13px;
    color:var(--text);
    font-size:13px;
}

.owner{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
}

/* ================= MAP ================= */

.map-section{
    background:white;
    padding:55px 5%;
    margin-top:60px;
}

.map{
    max-width:1200px;
    height:400px;
    margin:auto;
    border-radius:18px;
    background:
    linear-gradient(rgba(233,237,227,.78),rgba(233,237,227,.78)),
    url("https://images.unsplash.com/photo-1524666041070-9cff998a5d6b?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    position:relative;
    overflow:hidden;
}

.map-pin{
    position:absolute;
    background:var(--olive);
    color:white;
    padding:9px 13px;
    border-radius:20px;
    font-weight:bold;
}

.map-center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:18px 25px;
    border-radius:12px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

/* ================= CTA ================= */

.cta{
    max-width:1200px;
    margin:60px auto;
    padding:0 25px;
}

.cta-box{
    background:var(--dark);
    color:white;
    border-radius:18px;
    padding:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;
}

.cta-box h2{
    font-size:29px;
    margin-bottom:9px;
}

.cta-box p{
    color:#c8cdc6;
}

.cta-btn{
    background:var(--olive);
    color:white;
    text-decoration:none;
    padding:14px 22px;
    border-radius:9px;
    font-weight:bold;
    white-space:nowrap;
}

/* ================= FOOTER ================= */

footer{
    background:#20251f;
    color:white;
    padding:50px 5%;
}

.footer-grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1.5fr;
    gap:40px;
}

footer h3{
    margin-bottom:16px;
}

footer p,
footer a{
    display:block;
    color:#c1c7c0;
    text-decoration:none;
    margin-bottom:10px;
    font-size:14px;
}

footer a:hover{
    color:white;
}

.social{
    margin-top
