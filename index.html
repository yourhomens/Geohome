<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Your Home - უძრავი ქონება</title>
    <style>
        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .listing-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .listing-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .listing-content {
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="search-box">
        <!-- ძიების ბლოკი -->
    </div>

    <main>
        <h1>უძრავი ქონების ბოლო განცხადებები</h1>
        <div id="listings-container" class="listings-grid">
            <p>იტვირთება...</p>
        </div>
    </main>

    <!-- Supabase ბიბლიოთეკა -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase ინიციალიზაცია (ჩასვი შენი რეალური მონაცემები)
        const SUPABASE_URL = 'შენი_სუპაბეის_ურლ';
        const SUPABASE_ANON_KEY = 'შენი_სუპაბეის_ანონ_ქი';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // მიმდინარე მომხმარებლის შემოწმება
        async function loadCurrentUser() {
            try {
                // შენი ავტორიზაციის ლოგიკა
            } catch (error) {
                console.error('მომხმარებლის შემოწმების შეცდომა:', error);
            }
        }

        // განცხადებების ბაზიდან წამოღება და გამოტანა
        async function loadListings() {
            const container = document.getElementById('listings-container');
            
            try {
                const { data, error } = await supabase
                    .from('properties') 
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>განცხადებები ჯერ არ არის დამატებული.</p>';
                    return;
                }

                container.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'listing-card';
                    
                    card.innerHTML = `
                        <img src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.title || 'უძრავი ქონება'}">
                        <div class="listing-content">
                            <h3>${item.title || 'სათაური არ არის'}</h3>
                            <p class="price">ფასი: <strong>${item.price} $</strong></p>
                            <p class="location">მდებარეობა: ${item.location || 'მითითებული არ არის'}</p>
                            <p class="details">ოთახები: ${item.rooms || '-'} | ფართობი: ${item.area || '-'} მ²</p>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('შეცდომა მონაცემების წამოღებისას:', error.message);
                container.innerHTML = '<p>განცხადებების ჩატვირთვა ვერ მოხერხდა.</p>';
            }
        }

        /* =========================
           START
        ========================= */

        document.addEventListener('DOMContentLoaded', () => {
            loadCurrentUser();
            loadListings();

            const searchBox = document.querySelector(".search-box");
            if (searchBox) {
                searchBox.scrollIntoView({
                    behavior: "smooth"
                });
            }
        });
    </script>

</body>
</html>
