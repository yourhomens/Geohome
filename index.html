<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoHome</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0066cc;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

.hero{
padding:60px 20px;
text-align:center;
background:white;
}

.hero h1{
font-size:40px;
}

.hero p{
font-size:18px;
color:#555;
}

button{
background:#00a651;
color:white;
border:none;
padding:15px 30px;
border-radius:8px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.search{
margin-top:30px;
}

.search input{
padding:12px;
width:250px;
border:1px solid #ccc;
border-radius:8px;
}

.map{
margin:40px;
height:350px;
background:#ddd;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
border-radius:15px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>

<div class="logo">
🏠 GeoHome
</div>

<nav>
<a href="#">მთავარი</a>
<a href="#">იყიდება</a>
<a href="#">ქირავდება</a>
<a href="#">კონტაქტი</a>
</nav>

</header>

<section class="hero">

<h1>იპოვე შენი ახალი სახლი</h1>

<p>უძრავი ქონების თანამედროვე პლატფორმა საქართველოში</p>

<div class="search">

<input type="text" placeholder="მოძებნე ქალაქი">

</div>
</body>
</html>
