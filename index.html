<script>

/* REAL LOCAL ACCOUNT SYSTEM */

const loginEmailInput =
    document.querySelector('#loginForm input[type="text"]');

const loginPasswordInput =
    document.querySelector('#loginForm input[type="password"]');

const registerInputs =
    document.querySelectorAll('#registerForm input');

const fakeLogin =
    document.getElementById("fakeLogin");

const fakeRegister =
    document.getElementById("fakeRegister");

const forgotPassword =
    document.getElementById("forgotPassword");

const fakeFacebook =
    document.getElementById("fakeFacebook");


/* GET SAVED USERS */

function getUsers(){

    return JSON.parse(
        localStorage.getItem("yourHomeUsers") || "[]"
    );

}


/* SAVE USERS */

function saveUsers(users){

    localStorage.setItem(
        "yourHomeUsers",
        JSON.stringify(users)
    );

}


/* CURRENT USER */

function getCurrentUser(){

    return JSON.parse(
        localStorage.getItem("yourHomeCurrentUser") || "null"
    );

}


/* SAVE CURRENT USER */

function saveCurrentUser(user){

    localStorage.setItem(
        "yourHomeCurrentUser",
        JSON.stringify(user)
    );

}


/* UPDATE HEADER */

function updateLoginButton(){

    const user =
        getCurrentUser();

    const button =
        document.getElementById("loginButton");

    if(user){

        button.textContent =
            user.name;

        button.style.color =
            "var(--olive-dark)";

    }else{

        button.textContent =
            "შესვლა";

        button.style.color =
            "";

    }

}


/* REGISTER */

fakeRegister.addEventListener("click",function(){

    const name =
        registerInputs[0].value.trim();

    const email =
        registerInputs[1].value.trim().toLowerCase();

    const phone =
        registerInputs[2].value.trim();

    const password =
        registerInputs[3].value;

    const repeatPassword =
        registerInputs[4].value;


    if(!name){

        showMessage(
            "გთხოვთ შეიყვანოთ სახელი და გვარი."
        );

        return;

    }


    if(!email){

        showMessage(
            "გთხოვთ შეიყვანოთ ელფოსტა."
        );

        return;

    }


    if(!email.includes("@")){

        showMessage(
            "გთხოვთ შეიყვანოთ სწორი ელფოსტა."
        );

        return;

    }


    if(!phone){

        showMessage(
            "გთხოვთ შეიყვანოთ ტელეფონის ნომერი."
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "პაროლი მინიმუმ 6 სიმბოლოს უნდა შეიცავდეს."
        );

        return;

    }


    if(password !== repeatPassword){

        showMessage(
            "პაროლები ერთმანეთს არ ემთხვევა."
        );

        return;

    }


    const users =
        getUsers();


    const exists =
        users.some(function(user){

            return user.email === email;

        });


    if(exists){

        showMessage(
            "ეს ელფოსტა უკვე რეგისტრირებულია."
        );

        return;

    }


    const newUser = {

        id:
            Date.now(),

        name:
            name,

        email:
            email,

        phone:
            phone,

        password:
            password,

        createdAt:
            new Date().toISOString()

    };


    users.push(newUser);

    saveUsers(users);

    saveCurrentUser(newUser);

    updateLoginButton();


    loginModal.classList.remove("active");


    registerInputs.forEach(function(input){

        input.value = "";

    });


    showMessage(
        "რეგისტრაცია წარმატებით დასრულდა ❤️"
    );

});


/* LOGIN */

fakeLogin.addEventListener("click",function(){

    const email =
        loginEmailInput.value
        .trim()
        .toLowerCase();

    const password =
        loginPasswordInput.value;


    if(!email || !password){

        showMessage(
            "გთხოვთ შეავსოთ ყველა ველი."
        );

        return;

    }


    const users =
        getUsers();


    const user =
        users.find(function(item){

            return (
                item.email === email &&
                item.password === password
            );

        });


    if(!user){

        showMessage(
            "ელფოსტა ან პაროლი არასწორია."
        );

        return;

    }


    saveCurrentUser(user);

    updateLoginButton();

    loginModal.classList.remove("active");


    loginEmailInput.value = "";

    loginPasswordInput.value = "";


    showMessage(
        "კეთილი იყოს თქვენი დაბრუნება, " +
        user.name +
        " ❤️"
    );

});


/* FORGOT PASSWORD */

forgotPassword.addEventListener("click",function(){

    const email =
        loginEmailInput.value
        .trim()
        .toLowerCase();


    if(!email){

        showMessage(
            "ჯერ შეიყვანეთ თქვენი ელფოსტა."
        );

        return;

    }


    const users =
        getUsers();


    const user =
        users.find(function(item){

            return item.email === email;

        });


    if(!user){

        showMessage(
            "ამ ელფოსტით ანგარიში ვერ მოიძებნა."
        );

        return;

    }


    showMessage(
        "პაროლის აღდგენის ფუნქციას შემდეგ ეტაპზე დავამატებთ."
    );

});


/* FACEBOOK */

fakeFacebook.addEventListener("click",function(){

    showMessage(
        "Facebook-ით შესვლა შემდეგ ეტაპზე დავაკავშიროთ."
    );

});


/* ACCOUNT BUTTON */

loginButton.addEventListener("click",function(){

    const user =
        getCurrentUser();


    if(user){

        const answer =
            confirm(
                "თქვენ შესული ხართ როგორც " +
                user.name +
                ".\n\nგსურთ ანგარიშიდან გამოსვლა?"
            );


        if(answer){

            localStorage.removeItem(
                "yourHomeCurrentUser"
            );

            updateLoginButton();

            showMessage(
                "თქვენ გამოხვედით ანგარიშიდან."
            );

        }

    }else{

        loginModal.classList.add("active");

    }

});


/* INITIAL CHECK */

updateLoginButton();


/* LANGUAGE */

const translations = {

    ka:{
        title:"იპოვე უძრავი ქონება საქართველოში",
        subtitle:"იყიდე, იქირავე ან იგირავე — მოძებნე შენთვის სასურველი ქონება მარტივად.",
        location:"მდებარეობა",
        locationPlaceholder:"ქალაქი, უბანი ან ქუჩა",
        property:"ქონების ტიპი",
        rooms:"ოთახები",
        price:"ფასი",
        pricePlaceholder:"მაგ. $100,000",
        search:"ძებნა",
        popular:"🔥 ყველაზე ნახვადი",
        all:"ყველას ნახვა →",
        ctaTitle:"გაქვს უძრავი ქონება?",
        ctaText:"განათავსე განცხადება Your Home-ზე.",
        add:"+ განცხადების დამატება",
        footerDescription:"იპოვე უძრავი ქონება საქართველოში.",
        propertyTitle:"ქონება",
        help:"დახმარება",
        contact:"დაგვიკავშირდით"
    },

    en:{
        title:"Find real estate in Georgia",
        subtitle:"Buy, rent or pledge — find the property that suits you.",
        location:"Location",
        locationPlaceholder:"City, district or street",
        property:"Property type",
        rooms:"Rooms",
        price:"Price",
        pricePlaceholder:"e.g. $100,000",
        search:"Search",
        popular:"🔥 Most viewed",
        all:"View all →",
        ctaTitle:"Have a property?",
        ctaText:"Post your property on Your Home.",
        add:"+ Add listing",
        footerDescription:"Find real estate in Georgia.",
        propertyTitle:"Property",
        help:"Help",
        contact:"Contact us"
    },

    ru:{
        title:"Найдите недвижимость в Грузии",
        subtitle:"Купите, арендуйте или заложите — найдите подходящую недвижимость.",
        location:"Местоположение",
        locationPlaceholder:"Город, район или улица",
        property:"Тип недвижимости",
        rooms:"Комнаты",
        price:"Цена",
        pricePlaceholder:"например $100,000",
        search:"Поиск",
        popular:"🔥 Самые просматриваемые",
        all:"Посмотреть все →",
        ctaTitle:"У вас есть недвижимость?",
        ctaText:"Разместите объявление на Your Home.",
        add:"+ Добавить объявление",
        footerDescription:"Найдите недвижимость в Грузии.",
        propertyTitle:"Недвижимость",
        help:"Помощь",
        contact:"Контакты"
    }

};


function changeLanguage(lang){

    const t =
        translations[lang];


    document.documentElement.lang =
        lang;


    document.getElementById("heroTitle")
        .textContent = t.title;

    document.getElementById("heroSubtitle")
        .textContent = t.subtitle;

    document.getElementById("locationLabel")
        .textContent = t.location;

    document.getElementById("locationInput")
        .placeholder =
        t.locationPlaceholder;

    document.getElementById("typeLabel")
        .textContent = t.property;

    document.getElementById("roomsLabel")
        .textContent = t.rooms;

    document.getElementById("priceLabel")
        .textContent = t.price;

    document.getElementById("priceInput")
        .placeholder =
        t.pricePlaceholder;

    document.getElementById("searchButton")
        .textContent = t.search;

    document.getElementById("popularTitle")
        .textContent = t.popular;

    document.getElementById("showAll")
        .textContent = t.all;

    document.getElementById("ctaTitle")
        .textContent = t.ctaTitle;

    document.getElementById("ctaText")
        .textContent = t.ctaText;

    document.getElementById("addButton")
        .textContent = t.add;

    document.getElementById("ctaButton")
        .textContent = t.add;

    document.getElementById("footerDescription")
        .textContent =
        t.footerDescription;

    document.getElementById("footerProperty")
        .textContent =
        t.propertyTitle;

    document.getElementById("footerHelp")
        .textContent =
        t.help;

    document.getElementById("footerContact")
        .textContent =
        t.contact;

}


document
.getElementById("language")
.addEventListener("change",function(){

    changeLanguage(this.value);

});

</script>

</body>
</html>
