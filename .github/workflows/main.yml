name: Update sitemap

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths-ignore:
      - "sitemap.xml"

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap
        env:
          SUPABASE_URL: https://clymnqkiarrpatcfuwwt.supabase.co
          SUPABASE_KEY: sb_publishable__CQ1qg7_KizhMzPKDaD3tA_TQq6Azs
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          echo '  <url><loc>https://yourhome24.ge/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/apartments-tbilisi/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/rent-tbilisi/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/owner-apartments-tbilisi/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/new-projects-tbilisi/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/apartments-batumi/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/pledge-tbilisi/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/tbilisi-districts/</loc></url>' >> sitemap.xml
          echo '  <url><loc>https://yourhome24.ge/craftsmen/</loc></url>' >> sitemap.xml

              response=$(curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/listings?select=id")

          echo "$response" | jq -r '.[]? | select(type == "object" and .id != null) | "  <url><loc>https://yourhome24.ge/?listing=\(.id)</loc></url>"' >> sitemap.xml

          echo '</urlset>' >> sitemap.xml

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Update sitemap"
          git push
